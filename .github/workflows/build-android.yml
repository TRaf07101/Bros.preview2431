name: Gerar aplicativo Android (APK)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Compilar o app
        run: |
          [ -f bros-app-pronto.zip ] || { echo "Falta o arquivo bros-app-pronto.zip na raiz do repositório. Arquivos aqui:"; ls -la; exit 1; }
          mkdir -p _projeto && unzip -q -o bros-app-pronto.zip -d _projeto
          bash "$(find _projeto -maxdepth 3 -name build-android.sh | head -1)"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: app-${{ github.run_number }}
          name: Aplicativo Bros. (versão ${{ github.run_number }})
          body: Baixe o arquivo bros-rastreador.apk no celular Android e abra para instalar.
          files: bros-rastreador.apk
